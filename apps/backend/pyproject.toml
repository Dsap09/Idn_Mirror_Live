[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "idn-live-mirror-backend"
version = "1.0.0"
description = "FastAPI backend for IDN Live Mirror"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1"
]
